<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAMI Project</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-white text-black">

    <div id="view-auth" class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-sm">
            <h1 class="text-4xl font-black mb-8 tracking-tighter">BAMI LOGIN</h1>
            <form id="auth-form" class="space-y-4">
                <input type="email" id="email" placeholder="Email" class="w-full p-3 border border-black rounded-none outline-none" required>
                <input type="password" id="password" placeholder="Password" class="w-full p-3 border border-black rounded-none outline-none" required>
                <button type="submit" class="w-full bg-black text-white p-3 font-bold hover:bg-gray-800 transition">ENTER</button>
            </form>
        </div>
    </div>

    <div id="app-root" class="hidden min-h-screen">
        <header class="p-6 border-b border-black flex justify-between items-center">
            <h2 class="font-black text-xl tracking-tighter uppercase">BAMI HUB</h2>
            <button id="logout-btn" class="text-xs font-bold border border-black px-4 py-2 uppercase">Exit</button>
        </header>

        <main class="p-6 max-w-4xl mx-auto">
            <div class="flex gap-4 mb-12">
                <button onclick="window.switchView('roadmap')" class="font-bold border-b-2 border-black pb-1">ROADMAP</button>
                <button onclick="window.switchView('feed')" class="font-bold text-gray-400 hover:text-black transition">COMMUNITY</button>
            </div>

            <div id="view-dashboard">
                <div id="admin-roadmap-panel" class="hidden mb-10 border-2 border-black p-4">
                    <p class="text-[10px] font-bold mb-2">NEW UPDATE</p>
                    <input id="roadmap-title" type="text" placeholder="Title" class="w-full mb-2 p-2 border border-gray-200">
                    <textarea id="roadmap-desc" placeholder="Details" class="w-full mb-2 p-2 border border-gray-200"></textarea>
                    <button id="submit-roadmap" class="bg-black text-white px-6 py-2 text-sm font-bold">POST UPDATE</button>
                </div>
                <div id="roadmap-container" class="space-y-4"></div>
            </div>

            <div id="view-feed" class="hidden">
                <div id="admin-feed-panel" class="hidden mb-10 border-2 border-black p-4">
                    <textarea id="feed-input" placeholder="What's happening?" class="w-full mb-2 p-2 border border-gray-200"></textarea>
                    <button id="submit-feed" class="bg-black text-white px-6 py-2 text-sm font-bold">POST TO FEED</button>
                </div>
                <div id="feed-container" class="space-y-6"></div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, doc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAC_Grs2F0UEKfiUn1ckVYxE49Gj2UMAus",
            authDomain: "v1999-bfd2e.firebaseapp.com",
            projectId: "v1999-bfd2e",
            storageBucket: "v1999-bfd2e.firebasestorage.app",
            messagingSenderId: "243022609522",
            appId: "1:243022609522:web:0c4667ef677fa961ff96eb"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const ADMIN_UID = "HYnkQqkR3cNKUs2Ty3eqGlUXxdV2";

        // Logic to keep your view changes working
        window.switchView = (view) => {
            document.getElementById('view-dashboard').classList.toggle('hidden', view !== 'roadmap');
            document.getElementById('view-feed').classList.toggle('hidden', view !== 'feed');
        };

        document.getElementById('auth-form').onsubmit = async (e) => {
            e.preventDefault();
            try { await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value); } 
            catch (err) { alert("Access Denied"); }
        };

        document.getElementById('logout-btn').onclick = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('view-auth').classList.add('hidden');
                document.getElementById('app-root').classList.remove('hidden');
                const isAdmin = user.uid === ADMIN_UID;
                if (isAdmin) {
                    document.getElementById('admin-roadmap-panel').classList.remove('hidden');
                    document.getElementById('admin-feed-panel').classList.remove('hidden');
                }
                loadData(isAdmin);
            } else {
                document.getElementById('view-auth').classList.remove('hidden');
                document.getElementById('app-root').classList.add('hidden');
            }
        });

        function loadData(isAdmin) {
            onSnapshot(query(collection(db, 'updates'), orderBy('timestamp', 'desc')), (snap) => {
                document.getElementById('roadmap-container').innerHTML = snap.docs.map(d => `
                    <div class="pb-4 border-b border-gray-100">
                        <div class="flex justify-between items-start">
                            <h3 class="font-bold">${d.data().title}</h3>
                            ${isAdmin ? `<button onclick="window.delDoc('updates','${d.id}')" class="text-red-500 text-[10px] font-bold">DEL</button>` : ''}
                        </div>
                        <p class="text-sm text-gray-600">${d.data().desc}</p>
                    </div>`).join('');
            });

            onSnapshot(query(collection(db, 'social_posts'), orderBy('timestamp', 'desc')), (snap) => {
                document.getElementById('feed-container').innerHTML = snap.docs.map(d => `
                    <div class="p-4 border border-black">
                        <p class="text-sm mb-2">${d.data().text}</p>
                        ${isAdmin ? `<button onclick="window.delDoc('social_posts','${d.id}')" class="text-red-500 text-[10px] font-bold">REMOVE POST</button>` : ''}
                    </div>`).join('');
            });
        }

        window.delDoc = async (col, id) => { if(confirm("Delete permanently?")) await deleteDoc(doc(db, col, id)); };

        document.getElementById('submit-roadmap').onclick = async () => {
            const title = document.getElementById('roadmap-title').value;
            const desc = document.getElementById('roadmap-desc').value;
            if (title) await addDoc(collection(db, 'updates'), { title, desc, timestamp: serverTimestamp() });
            document.getElementById('roadmap-title').value = ''; document.getElementById('roadmap-desc').value = '';
        };

        document.getElementById('submit-feed').onclick = async () => {
            const text = document.getElementById('feed-input').value;
            if (text) await addDoc(collection(db, 'social_posts'), { text, userId: auth.currentUser.uid, timestamp: serverTimestamp() });
            document.getElementById('feed-input').value = '';
        };
    </script>
</body>
</html>
