<!-- Updated Social Feed Elements -->
<div id="view-feed">
    <div id="feed-admin-panel">
        <label for="feed-post-text">Post:</label>
        <input type="text" id="feed-post-text" name="feed-post-text" placeholder="What's on your mind?">
        <input type="file" id="feed-image-upload" name="feed-image-upload">
        <button id="feed-submit-post" name="feed-submit-post">Submit Post</button>
    </div>
    <div id="poll-creator">
        <label for="poll-question">Poll Question:</label>
        <input type="text" id="poll-question" name="poll-question" placeholder="Ask a question?">
        <div id="poll-options">
            <label for="poll-option-1">Option 1:</label>
            <input type="text" id="poll-option-1" name="poll-option-1">
            <label for="poll-option-2">Option 2:</label>
            <input type="text" id="poll-option-2" name="poll-option-2">
            <label for="poll-option-3">Option 3:</label>
            <input type="text" id="poll-option-3" name="poll-option-3">
            <label for="poll-option-4">Option 4:</label>
            <input type="text" id="poll-option-4" name="poll-option-4">
        </div>
        <button id="create-poll" name="create-poll">Create Poll</button>
    </div>
</div>
