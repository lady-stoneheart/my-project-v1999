<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BAMI Hub | Project Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #000000; --bg: #ffffff; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #ffffff; color: #000000; margin: 0; overflow-x: hidden; }
        .hidden { display: none !important; }
        .stagger-item { opacity: 0; animation: staggerIn 0.5s ease forwards; }
        @keyframes staggerIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .loader { border-top-color: #000000; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .sidebar-item.active { background-color: #000000; color: #ffffff; }
        .feed-card { border: 2px solid #000000; border-radius: 2.5rem; transition: transform 0.2s ease; }
        @media (max-width: 640px) { #sidebar { transform: translateX(-100%); width: 280px !important; transition: transform 0.3s ease; } #sidebar.sidebar-open { transform: translateX(0); } }
    </style>
</head>
<body class="antialiased">

    <div id="global-loader" class="fixed inset-0 z-[100] bg-white flex flex-col items-center justify-center">
        <div class="loader ease-linear rounded-full border-4 border-neutral-100 h-16 w-16 mb-4"></div>
        <p class="font-black tracking-widest text-[10px] uppercase animate-pulse">Syncing BAMI Hub</p>
    </div>

    <div id="app-root" class="min-h-[100dvh] w-full flex flex-row relative overflow-hidden">
        
        <nav id="sidebar" class="hidden fixed sm:relative z-50 h-[100dvh] w-20 lg:w-64 bg-white border-r border-neutral-200 flex flex-col">
            <div class="p-6 flex flex-col items-center lg:items-start gap-3">
                <div class="w-10 h-10 bg-black rounded-xl flex items-center justify-center text-white shadow-xl">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                </div>
                <h2 class="hidden lg:block font-black text-xs uppercase tracking-[2px]">BAMI Hub</h2>
            </div>
            <div class="flex-1 px-4 space-y-2 py-8">
                <button onclick="window.switchView('roadmap')" id="nav-roadmap" class="sidebar-item active w-full flex items-center justify-center lg:justify-start gap-4 p-4 rounded-2xl hover:bg-neutral-100 transition-all">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
                    <span class="hidden lg:block font-bold text-sm">Roadmap</span>
                </button>
                <button onclick="window.switchView('feed')" id="nav-feed" class="sidebar-item w-full flex items-center justify-center lg:justify-start gap-4 p-4 rounded-2xl hover:bg-neutral-100 transition-all">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10l4 4v10a2 2 0 01-2 2z" /></svg>
                    <span class="hidden lg:block font-bold text-sm">Feed</span>
                </button>
            </div>
            <div class="p-4 border-t border-neutral-100">
                <button id="logout-btn" class="w-full flex items-center justify-center lg:justify-start gap-4 p-4 rounded-2xl text-neutral-400 hover:text-black">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                    <span class="hidden lg:block font-bold text-sm">Exit</span>
                </button>
            </div>
        </nav>

        <div class="flex-1 h-[100dvh] overflow-y-auto relative">
            
            <div id="view-auth" class="hidden min-h-screen flex items-center justify-center p-6 bg-white">
                <div class="w-full max-w-md p-10 border border-neutral-200 rounded-[3rem] shadow-2xl text-center">
                    <div class="inline-flex w-16 h-16 bg-black rounded-2xl items-center justify-center mb-6 text-white">
                        <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                    </div>
                    <h1 class="text-3xl font-black mb-8">BAMI HUB</h1>
                    <form id="auth-form" class="space-y-4">
                        <input type="email" id="email" placeholder="Email" class="w-full p-4 bg-neutral-50 border border-neutral-200 rounded-xl outline-none font-bold" required>
                        <input type="password" id="password" placeholder="Password" class="w-full p-4 bg-neutral-50 border border-neutral-200 rounded-xl outline-none font-bold" required>
                        <button type="submit" class="w-full bg-black text-white font-black py-4 rounded-xl shadow-lg hover:bg-neutral-800 transition-all">ENTER HUB</button>
                    </form>
                </div>
            </div>

            <div id="view-dashboard" class="hidden p-6 sm:p-20 max-w-4xl mx-auto">
                <h1 class="text-5xl sm:text-7xl font-black tracking-tighter mb-4 uppercase">Roadmap</h1>
                <p class="text-neutral-400 font-bold tracking-widest mb-12 uppercase text-xs">Live Development Sync</p>

                <div id="admin-roadmap-panel" class="hidden mb-12 bg-black p-8 rounded-[2rem] text-white">
                    <h3 class="font-black mb-4 uppercase">New Milestone</h3>
                    <div class="space-y-3">
                        <input id="roadmap-title" type="text" placeholder="Task Name" class="w-full p-4 bg-white/10 rounded-xl outline-none border border-white/10 font-bold">
                        <textarea id="roadmap-desc" placeholder="Details" class="w-full p-4 bg-white/10 rounded-xl outline-none border border-white/10 font-bold"></textarea>
                        <button id="submit-roadmap" class="w-full bg-white text-black font-black py-4 rounded-xl">ADD TO MAP</button>
                    </div>
                </div>

                <div id="roadmap-container" class="space-y-6"></div>
            </div>

            <div id="view-feed" class="hidden p-6 sm:p-20 max-w-3xl mx-auto">
                <h1 class="text-5xl font-black tracking-tighter mb-12 uppercase">Community</h1>
                
                <div id="admin-feed-panel" class="hidden mb-12 bg-black p-8 rounded-[2rem] text-white">
                    <textarea id="feed-input" placeholder="Broadcast message..." class="w-full p-4 bg-white/10 rounded-xl outline-none border border-white/10 font-bold mb-4"></textarea>
                    <button id="submit-feed" class="w-full bg-white text-black font-black py-4 rounded-xl">SEND POST</button>
                </div>

                <div id="feed-container" class="space-y-8"></div>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, doc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAC_Grs2F0UEKfiUn1ckVYxE49Gj2UMAus",
            authDomain: "v1999-bfd2e.firebaseapp.com",
            projectId: "v1999-bfd2e",
            storageBucket: "v1999-bfd2e.firebasestorage.app",
            messagingSenderId: "243022609522",
            appId: "1:243022609522:web:0c4667ef677fa961ff96eb"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        const ADMIN_UID = "HYnkQqkR3cNKUs2Ty3eqGlUXxdV2";
        const ADMIN_AVATAR = "https://i.ibb.co/d00DSvT5/IMG-2136.jpg";

        // UI Switching
        window.switchView = (view) => {
            ['view-auth', 'view-dashboard', 'view-feed'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById(view === 'roadmap' ? 'view-dashboard' : 'view-feed').classList.remove('hidden');
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`nav-${view}`).classList.add('active');
        };

        // Auth Logic
        document.getElementById('auth-form').onsubmit = async (e) => {
            e.preventDefault();
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
            } catch (err) { alert(err.message); }
        };

        document.getElementById('logout-btn').onclick = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            document.getElementById('global-loader').classList.add('hidden');
            if (user) {
                document.getElementById('view-auth').classList.add('hidden');
                document.getElementById('sidebar').classList.remove('hidden');
                window.switchView('roadmap');
                const isAdmin = user.uid === ADMIN_UID;
                if (isAdmin) {
                    document.getElementById('admin-roadmap-panel').classList.remove('hidden');
                    document.getElementById('admin-feed-panel').classList.remove('hidden');
                }
                loadData(isAdmin);
            } else {
                document.getElementById('view-auth').classList.remove('hidden');
                document.getElementById('sidebar').classList.add('hidden');
            }
        });

        // Data Management
        function loadData(isAdmin) {
            // Roadmap Listener
            onSnapshot(query(collection(db, 'updates'), orderBy('timestamp', 'desc')), (snap) => {
                document.getElementById('roadmap-container').innerHTML = snap.docs.map(d => {
                    const data = d.data();
                    return `
                        <div class="p-8 border-2 border-black rounded-[2.5rem] bg-white stagger-item">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="text-2xl font-black uppercase tracking-tighter">${data.title}</h3>
                                    <p class="mt-4 font-bold text-neutral-500 uppercase text-sm">${data.desc}</p>
                                </div>
                                ${isAdmin ? `<button onclick="deleteDoc(doc(db, 'updates', '${d.id}'))" class="text-red-500 font-black text-[10px] tracking-widest">DELETE</button>` : ''}
                            </div>
                        </div>`;
                }).join('');
            });

            // Feed Listener
            onSnapshot(query(collection(db, 'social_posts'), orderBy('timestamp', 'desc')), (snap) => {
                document.getElementById('feed-container').innerHTML = snap.docs.map(d => {
                    const data = d.data();
                    const isAdminPost = data.userId === ADMIN_UID;
                    return `
                        <div class="feed-card p-8 bg-white stagger-item">
                            <div class="flex items-center gap-4 mb-6">
                                <img src="${isAdminPost ? ADMIN_AVATAR : 'https://api.dicebear.com/7.x/avataaars/svg?seed='+data.userId}" class="w-12 h-12 rounded-full border-2 border-black">
                                <div>
                                    <h4 class="font-black text-xs uppercase">${isAdminPost ? 'B. AYMEN' : 'CONTRIBUTOR'}</h4>
                                    <p class="text-[9px] font-black text-neutral-400 tracking-widest uppercase">Member</p>
                                </div>
                                ${isAdmin ? `<button onclick="window.deletePost('${d.id}')" class="ml-auto text-red-500 font-black text-[10px]">DELETE</button>` : ''}
                            </div>
                            <p class="text-xl font-bold uppercase leading-tight">${data.text}</p>
                        </div>`;
                }).join('');
            });
        }

        // Admin Actions
        document.getElementById('submit-roadmap').onclick = async () => {
            const title = document.getElementById('roadmap-title').value;
            const desc = document.getElementById('roadmap-desc').value;
            if (title) {
                await addDoc(collection(db, 'updates'), { title, desc, timestamp: serverTimestamp() });
                document.getElementById('roadmap-title').value = '';
                document.getElementById('roadmap-desc').value = '';
            }
        };

        document.getElementById('submit-feed').onclick = async () => {
            const text = document.getElementById('feed-input').value;
            if (text) {
                await addDoc(collection(db, 'social_posts'), { text, userId: auth.currentUser.uid, timestamp: serverTimestamp() });
                document.getElementById('feed-input').value = '';
            }
        };

        window.deletePost = async (id) => { if(confirm("DELETE POST?")) await deleteDoc(doc(db, 'social_posts', id)); };
        window.db = db; window.doc = doc; window.deleteDoc = deleteDoc;
    </script>
</body>
</html>
